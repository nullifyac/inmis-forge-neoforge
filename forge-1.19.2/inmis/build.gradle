plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group
version = "${project.fabric_version}-${project.mod_version}-${project.minecraft_version}"
archivesBaseName = project.archives_base_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.theillusivec4.top/' }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

def compatProfile = (project.findProperty('compatProfile') ?: 'curios').toString()
if (!(compatProfile in ['none', 'curios'])) throw new GradleException('compatProfile must be none or curios')

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        runtimeServer {
            workingDirectory project.file('build/runtime/server')
            property 'forge.logging.console.level', 'info'
            property 'inmis.smokeServer', 'true'
            jvmArgs '-Xms512m', '-Xmx2g'
            mods {
                inmis { source sourceSets.main }
                inmis_game_tests { source sourceSets.gameTest }
            }
        }
        runtimeClient {
            workingDirectory project.file('build/runtime/client')
            property 'forge.logging.console.level', 'info'
            property 'inmis.smokeClient', 'true'
            jvmArgs '-Xms512m', '-Xmx2g'
            args '--username', 'Dev', '--width', '1280', '--height', '720'
            mods {
                inmis { source sourceSets.main }
                inmis_game_tests { source sourceSets.gameTest }
            }
        }
        gameTestServer {
            forceExit false
            workingDirectory project.file('build/gameTest')
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', 'inmis_game_tests'
            property 'forge.logging.console.level', 'info'
            jvmArgs '-Xms512m', '-Xmx2g'

            mods {
                inmis {
                    source sourceSets.main
                }
                inmis_game_tests {
                    source sourceSets.gameTest
                }
            }
        }

        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'

            mods {
                inmis {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'

            mods {
                inmis {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'inmis', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                inmis {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${project.curios_version}")
    if (compatProfile == 'curios') runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${project.curios_version}")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

mixin {
    add sourceSets.main, "inmis.refmap.json"
    config "inmis.mixins.json"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(jar)
            artifact(sourcesJar)
        }
    }
}
